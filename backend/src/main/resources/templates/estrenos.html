<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrenos - AnimeNews</title>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
            rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body class="estrenos-theme">
<header th:replace="~{fragment/navBar :: navBar('releases')}"></header>
<main class="container my-5 animate-fade-up">

    <div class="estrenos-header mb-4">
        <h2 class="display-5 fw-bold font-heading text-white">Estrenos</h2>
        <div class="subtitle-border">
            <p class="mb-0" style="color: #a0b3c9;">Descubre los animes más esperados de la temporada.</p>
        </div>
    </div>

    <div class="filter-bar d-flex flex-wrap align-items-center justify-content-between p-3 mb-5 rounded">
        <div class="d-flex flex-wrap gap-3">
            <select class="form-select bg-dark text-white border-secondary w-auto">
                <option selected>Temporada: Primavera</option>
                <option value="1">Verano</option>
                <option value="2">Otoño</option>
                <option value="3">Invierno</option>
            </select>

            <select class="form-select bg-dark text-white border-secondary w-auto">
                <option selected>Año: 2024</option>
                <option value="1">2025</option>
                <option value="2">2026</option>
            </select>

            <select class="form-select bg-dark text-white border-secondary w-auto">
                <option selected>Género: Todos</option>
                <option value="1">Shonen</option>
                <option value="2">Isekai</option>
                <option value="3">Seinen</option>
            </select>
        </div>

        <button class="btn btn-outline-light mt-3 mt-md-0">
            <i class="fas fa-filter me-2"></i>Filtrar
        </button>
    </div>
    <div class="cards-grid">
        <div class="card dark-card">
            <div class="card-img card-img-full position-relative" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVNujp_l9PzYgB6j8kOG5BvBk2I1WtgQVB9MWfbntIpg&s=10');
            height: 400px;">
                <span class="custom-badge position-absolute top-0 start-0 m-3 shadow">🔥 DESTACADO</span>
            </div>
            <div class="card-content text-white">
                <span class="card-category text-primary">DARK FANTASY</span>
                <h3 class="font-heading fs-5 mt-2 mb-0">Lord Of Mistery </h3>
            </div>
            <div class="card-footer-custom">
                <span class="text-muted small"><i class="far fa-calendar-alt me-1"></i> Sábados</span>
                <button class="bookmark-btn"><i class="far fa-bookmark"></i></button>
            </div>
        </div>

        <div class="card dark-card">
            <div class="card-img card-img-full position-relative"
                 style="background-image: url('https://static.wikia.nocookie.net/evangelion/images/d/d2/Neon_Genesis_Evangelion_Platinum.jpg/revision/latest?cb=20230829054407&path-prefix=es'); height: 400px;">
            </div>
            <div class="card-content text-white">
                <span class="card-category text-primary">MECHA / SCI-FI</span>
                <h3 class="font-heading fs-5 mt-2 mb-0">Neon Genesis Overture</h3>
            </div>
            <div class="card-footer-custom">
                <span class="text-muted small"><i class="far fa-calendar-alt me-1"></i> Domingos</span>
                <button class="bookmark-btn"><i class="far fa-bookmark"></i></button>
            </div>
        </div>
        <div class="card dark-card">
            <div class="card-img card-img-full position-relative"
                 style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXOPJggfGt9_UNntOWus_XbjYqZlRdW5OTRtsmD_gzZPApVG1c6yI4upN9&s=10'); height: 400px;">
            </div>
            <div class="card-content text-white">
                <span class="card-category text-primary">ISEKAI / MAGIA</span>
                <h3 class="font-heading fs-5 mt-2 mb-0">Reincarnated as a Grand Magus</h3>
            </div>
            <div class="card-footer-custom">
                <span class="text-muted small"><i class="far fa-calendar-alt me-1"></i> Miércoles</span>
                <button class="bookmark-btn"><i class="far fa-bookmark"></i></button>
            </div>
        </div>

        <div class="card dark-card">
            <div class="card-img card-img-full position-relative"
                 style="background-image: url('https://m.media-amazon.com/images/I/91vQnWvGC-L._AC_UF1000,1000_QL80_.jpg'); height: 400px;">
            </div>
            <div class="card-content text-white">
                <span class="card-category text-primary">FANTASY / SHONEN</span>
                <h3 class="font-heading fs-5 mt-2 mb-0">El regreso del cazador de suicidios clase SSS]</h3>
            </div>
            <div class="card-footer-custom">
                <span class="text-muted small"><i class="far fa-calendar-alt me-1"></i> Viernes</span>
                <button class="bookmark-btn"><i class="far fa-bookmark"></i></button>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{fragment/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
