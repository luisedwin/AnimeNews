<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias - AnimeNews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="noticias-theme">

<header th:replace="~{fragment/navBar :: navBar('news')}"></header>

<main class="container my-5 animate-fade-up">
    <div class="row g-4">
        
        <div class="col-lg-8">
            
            <div class="news-hero-card mb-4" id="noticia-destacada" hidden>
                <img id="destacada-imagen" src="" alt="">
                <div class="card-overlay"></div>
                <div class="card-content">
                    <span class="news-badge">DESTACADO</span>
                    <h2 id="destacada-titulo"></h2>
                    <p id="destacada-resumen"></p>
                    <a class="btn-news-primary" id="destacada-leer">Leer Artículo <i class="fas fa-arrow-right ms-2"></i></a>
                </div>
            </div>

            <p id="estado-noticias" class="text-muted" role="status">Cargando noticias...</p>
            <div class="row g-4" id="lista-noticias"></div>
        </div>

        <aside class="col-lg-4">
            
            <div class="news-sidebar-widget mb-4">
                <h3 class="widget-title"><i class="fas fa-chart-line text-primary me-2"></i> Lo más leído</h3>
                <ul class="most-read-list" id="noticias-destacadas-lista"></ul>
            </div>

            <div class="news-sidebar-widget newsletter-box text-center">
                <i class="fas fa-envelope newsletter-icon"></i>
                <h3 class="mt-3 mb-2 text-white">Boletín Informativo</h3>
                <p class="text-muted small mb-4">Recibe las últimas noticias y estrenos directamente en tu correo.</p>
                <form>
                    <input type="email" class="form-control newsletter-input mb-3" placeholder="Tu correo electrónico">
                    <button type="submit" class="btn-news-primary w-100">SUSCRIBIRSE</button>
                </form>
            </div>

        </aside>

    </div>
</main>

<footer th:replace="~{fragment/footer :: footer}"></footer>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_NOTICIAS = '/api/noticias';
    const listaNoticias = document.getElementById('lista-noticias');
    const estadoNoticias = document.getElementById('estado-noticias');

    function textoSeguro(valor, alternativo = '') {
        return valor == null || valor === '' ? alternativo : String(valor);
    }

    function crearTarjeta(noticia) {
        const columna = document.createElement('div');
        columna.className = 'col-md-6';

        const tarjeta = document.createElement('article');
        tarjeta.className = 'news-standard-card';

        if (noticia.imagenUrl) {
            const wrapperImagen = document.createElement('div');
            wrapperImagen.className = 'img-wrapper';
            const imagen = document.createElement('img');
            imagen.src = noticia.imagenUrl;
            imagen.alt = textoSeguro(noticia.titulo, 'Imagen de noticia');
            imagen.loading = 'lazy';
            wrapperImagen.appendChild(imagen);
            tarjeta.appendChild(wrapperImagen);
        }

        const contenido = document.createElement('div');
        contenido.className = 'content';
        const categoria = document.createElement('span');
        categoria.className = 'category';
        categoria.textContent = textoSeguro(noticia.categoria, 'ANIME');
        const titulo = document.createElement('h3');
        titulo.textContent = textoSeguro(noticia.titulo, 'Noticia sin título');
        const resumen = document.createElement('p');
        resumen.textContent = textoSeguro(noticia.resumen);

        contenido.append(categoria, titulo, resumen);
        tarjeta.appendChild(contenido);
        const enlaceTarjeta = document.createElement('a');
        enlaceTarjeta.href = `/detalle-noticias/${encodeURIComponent(noticia.id)}`;
        enlaceTarjeta.className = 'noticia-card-link';
        enlaceTarjeta.setAttribute('aria-label', `Leer noticia: ${textoSeguro(noticia.titulo)}`);
        while (tarjeta.firstChild) enlaceTarjeta.appendChild(tarjeta.firstChild);
        tarjeta.appendChild(enlaceTarjeta);
        columna.appendChild(tarjeta);
        return columna;
    }

    function mostrarDestacada(noticia) {
        const contenedor = document.getElementById('noticia-destacada');
        const imagen = document.getElementById('destacada-imagen');
        if (noticia.imagenUrl) {
            imagen.src = noticia.imagenUrl;
            imagen.alt = textoSeguro(noticia.titulo, 'Imagen de noticia destacada');
        } else {
            imagen.remove();
        }
        document.getElementById('destacada-titulo').textContent = textoSeguro(noticia.titulo);
        document.getElementById('destacada-resumen').textContent = textoSeguro(noticia.resumen);
        document.getElementById('destacada-leer').href = `/detalle-noticias/${encodeURIComponent(noticia.id)}`;
        contenedor.hidden = false;
    }

    async function cargarNoticias() {
        try {
            const respuesta = await fetch(API_NOTICIAS, { headers: { Accept: 'application/json' } });
            if (!respuesta.ok) throw new Error(`Error HTTP ${respuesta.status}`);

            const noticias = await respuesta.json();
            if (!Array.isArray(noticias)) throw new Error('La respuesta de noticias no tiene el formato esperado.');

            const destacada = noticias.find(noticia => noticia.destacada);
            if (destacada) mostrarDestacada(destacada);

            const restantes = noticias.filter(noticia => !destacada || noticia.id !== destacada.id);
            listaNoticias.replaceChildren(...restantes.map(crearTarjeta));

            const listaTop = document.getElementById('noticias-destacadas-lista');
            listaTop.replaceChildren(...noticias.slice(0, 4).map((noticia, indice) => {
                const item = document.createElement('li');
                const numero = document.createElement('span');
                numero.className = 'number';
                numero.textContent = String(indice + 1).padStart(2, '0');
                const info = document.createElement('div');
                info.className = 'info';
                const titulo = document.createElement('h4');
                const enlace = document.createElement('a');
                enlace.href = `/detalle-noticias/${encodeURIComponent(noticia.id)}`;
                enlace.textContent = textoSeguro(noticia.titulo, 'Noticia sin título');
                titulo.appendChild(enlace);
                info.appendChild(titulo);
                item.append(numero, info);
                return item;
            }));

            estadoNoticias.textContent = noticias.length ? '' : 'Todavía no hay noticias publicadas.';
            estadoNoticias.hidden = noticias.length > 0;
        } catch (error) {
            console.error('No se pudieron cargar las noticias:', error);
            estadoNoticias.textContent = 'No se pudieron cargar las noticias. Intenta nuevamente más tarde.';
        }
    }

    cargarNoticias();
</script>


</body>
</html>
