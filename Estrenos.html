<body class="estrenos-theme">
<main class="container my-5 animate-fade-up">

    <div class="estrenos-header mb-4">
        <h2 class="display-5 fw-bold font-heading text-white">Estrenos</h2>
        <div class="subtitle-border">
            <p class="mb-0" style="color: #a0b3c9;">Descubre los animes más esperados de la temporada.</p>
        </div>
    </div>

    <div class="filter-bar d-flex flex-wrap align-items-center justify-content-between p-3 mb-5 rounded">
        <div class="d-flex flex-wrap gap-3">
            <select class="form-select bg-dark text-white border-secondary w-auto">
                <option selected>Temporada: Primavera</option>
                <option value="1">Verano</option>
                <option value="2">Otoño</option>
                <option value="3">Invierno</option>
            </select>

            <select class="form-select bg-dark text-white border-secondary w-auto">
                <option selected>Año: 2024</option>
                <option value="1">2025</option>
                <option value="2">2026</option>
            </select>

            <select class="form-select bg-dark text-white border-secondary w-auto">
                <option selected>Género: Todos</option>
                <option value="1">Shonen</option>
                <option value="2">Isekai</option>
                <option value="3">Seinen</option>
            </select>
        </div>

        <button class="btn btn-outline-light mt-3 mt-md-0">
            <i class="fas fa-filter me-2"></i>Filtrar
        </button>
    </div>
