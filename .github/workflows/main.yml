name: Test de funcionalidad Rama Noticias

on:
  push:
    branches: [ "dev-Candia-noticias-springboot" ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "dev-Candia-noticias-springboot" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilar
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Dar permisos de ejecución a Maven
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias
        working-directory: ./backend
        run: ./mvnw test

      - name: Empaquetar aplicación (JAR)
        working-directory: ./backend
        run: ./mvnw package -DskipTests

      - name: Guardar artefacto ejecutable (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: backend-news-service
          path: backend/target/*.jar
          retention-days: 3
