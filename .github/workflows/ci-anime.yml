name: CI - Sección Anime (Individual)

on:
  push:
    branches: [ "v2_Mendez", "springboot" ] # Pon tu rama aquí
  pull_request:
    branches: [ "v2_Mendez", "springboot" ]
  workflow_dispatch: # Esto te permite ejecutarlo manualmente desde GitHub

jobs:
  build-anime:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución a Maven Wrapper
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Compilar proyecto con Maven
        working-directory: ./backend
        run: ./mvnw clean compile -DskipTests