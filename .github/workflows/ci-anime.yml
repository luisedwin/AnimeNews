name: CI - Sección Anime (Individual)

# Se ejecuta al hacer push o pull request a la rama springboot
on:
  push:
    branches: [ "springboot" ] 
    # Solo se activa si se modifican TUS archivos
    paths:
      - 'backend/src/main/resources/templates/anime.html'
      - 'backend/src/main/resources/static/css/anime.css'
      - 'backend/src/main/java/com/example/demo/controller/AnimeController.java'
      - 'backend/src/main/java/com/example/demo/model/Anime.java'
      - 'backend/src/main/java/com/example/demo/service/AnimeService.java'
      - 'backend/src/main/java/com/example/demo/repository/AnimeRepository.java'
      - '.github/workflows/ci-anime.yml'
  pull_request:
    branches: [ "springboot" ]
    paths:
      - 'backend/src/main/resources/templates/anime.html'
      - 'backend/src/main/resources/static/css/anime.css'
      - 'backend/src/main/java/com/example/demo/**'

jobs:
  build-anime:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configura Java 21
    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 3. Le da permisos de ejecución al wrapper de Maven dentro de la carpeta backend
    - name: Dar permisos a mvnw
      working-directory: ./backend
      run: chmod +x mvnw

    # 4. Compila el proyecto (esto valida que tus cambios no rompan el código)
    # Usamos -DskipTests=true para evitar que intente conectarse a tu BD de Supabase en la nube
    - name: Compilar con Maven
      working-directory: ./backend
      run: ./mvnw clean package -B -DskipTests=true