services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,https://animenews-frontend-ge8q.onrender.com}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres.lcayyvbprhhtehmqsphn}
      SPRING_DATASOURCE_PASSWORD: "cCTwDNUXNVtxPaHO"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: "sb_secret__LqCH3mRgfTwc7kL5-MalA_UVBgYN9R"
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-manga-capitulos}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    environment:
      API_BASE_URL: ${API_BASE_URL:-https://animenews-backend-c1j3.onrender.com/api}
    restart: unless-stopped
