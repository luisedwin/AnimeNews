apiVersion: v1
kind: ConfigMap
metadata:
  name: animenews-nginx
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        location /api/ { proxy_pass http://127.0.0.1:8080; }
        location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animenews
spec:
  selector:
    matchLabels:
      app: animenews
  template:
    metadata:
      labels:
        app: animenews
    spec:
      containers:
        - name: backend
          image: localhost:5001/animenews-backend:local
          imagePullPolicy: Always
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.PostgreSQLDialect
            - name: SUPABASE_STORAGE_BUCKET
              value: manga-capitulos
          envFrom:
            - secretRef:
                name: animenews-secrets



        - name: frontend
          image: localhost:5001/animenews-frontend:local
          imagePullPolicy: Always
          env:
            - name: API_BASE_URL
              value: /api
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

              
      volumes:
        - name: nginx
          configMap:
            name: animenews-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: animenews
spec:
  type: NodePort
  selector:
    app: animenews
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080