apiVersion: v1
kind: ConfigMap
metadata:
  name: animenews-frontend-nginx
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /config.js {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animenews
  labels:
    app: animenews
spec:
  replicas: 1
  selector:
    matchLabels:
      app: animenews
  template:
    metadata:
      labels:
        app: animenews
    spec:
      containers:
        - name: backend
          image: animenews-backend:local
          imagePullPolicy: Never
          ports:
            - name: backend-http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.PostgreSQLDialect
            - name: SUPABASE_STORAGE_BUCKET
              value: manga-capitulos
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: animenews-secrets
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: animenews-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: animenews-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: animenews-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
                  optional: true
          startupProbe:
            tcpSocket:
              port: backend-http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: backend-http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: backend-http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: frontend
          image: animenews-frontend:local
          imagePullPolicy: Never
          ports:
            - name: frontend-http
              containerPort: 80
          env:
            - name: API_BASE_URL
              value: /api
          startupProbe:
            httpGet:
              path: /
              port: frontend-http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: frontend-http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: frontend-http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: frontend-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: frontend-nginx-config
          configMap:
            name: animenews-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: animenews
  labels:
    app: animenews
spec:
  type: NodePort
  selector:
    app: animenews
  ports:
    - name: http
      port: 80
      targetPort: frontend-http
      nodePort: 30080
